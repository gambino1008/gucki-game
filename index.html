<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة النقر</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: space-between; height: 100vh; overflow: hidden; }
        .header { padding: 20px; }
        .score-board { font-size: 45px; font-weight: bold; color: #38bdf8; margin-top: 10px; }
        .coin-container { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
        .tap-button { width: 210px; height: 210px; background: linear-gradient(135deg, #38bdf8, #0284c7); border: none; border-radius: 50%; cursor: pointer; box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4); font-size: 26px; font-weight: bold; color: white; outline: none; user-select: none; }
        .tap-button:active { transform: scale(0.90); }
        .footer { padding: 20px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="header"><p>رصيدك الحالي</p><div class="score-board" id="score">0</div></div>
    <div class="coin-container"><button class="tap-button" id="tapBtn">اضغط هنا! 🪙</button></div>
    <div class="footer"><p id="userInfo">جاري تحميل اللعبة...</p></div>
    <script>
        let tg = window.Telegram.WebApp; tg.expand();
        let score = localStorage.getItem('game_score') ? parseInt(localStorage.getItem('game_score')) : 0;
        const scoreElement = id => document.getElementById(id);
        scoreElement('score').innerText = score;
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) { scoreElement('userInfo').innerText = `مرحباً، ${tg.initDataUnsafe.user.first_name}!`; }
        document.getElementById('tapBtn').addEventListener('click', () => {
            score += 1; scoreElement('score').innerText = score; localStorage.setItem('game_score', score);
            if (tg.HapticFeedback) { tg.HapticFeedback.impactOccurred('light'); }
        });
    </script>
</body>
</html>
